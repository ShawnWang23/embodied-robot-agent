[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-agent"
version = "0.1.0"
description = "ROS2-decoupled mission core for a long-horizon indoor robot agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]
llm = [
    "openai>=2,<3",
]
perception = [
    "numpy>=1.26,<2",
    "opencv-python>=4.7,<5",
    "ultralytics>=8.4,<9",
]

[project.scripts]
robot-agent = "robot_agent.cli:main"
robot-agent-api = "robot_agent.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["robot_agent"]
omit = [
    "src/robot_agent/adapters/ros2_robot.py",
    "src/robot_agent/perception/camera.py",
    "src/robot_agent/cli.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

